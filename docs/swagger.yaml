basePath: /
definitions:
  handler.JsonRepositoryResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      forks_count:
        type: integer
      name:
        type: string
      stargazers_count:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API Gateway for GitHub repository information
  title: Repository API
  version: "1.0"
paths:
  /repositories/{owner}/{repo}:
    get:
      description: Returns information about a GitHub repository
      parameters:
      - description: Repository owner
        in: path
        name: owner
        required: true
        type: string
      - description: Repository name
        in: path
        name: repo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.JsonRepositoryResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
        "503":
          description: Service Unavailable
          schema:
            type: string
      summary: Get repository information
      tags:
      - repositories
swagger: "2.0"
