services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indexer}
      POSTGRES_DB: indexer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer -d indexer"]
      interval: 2s
      timeout: 3s
      retries: 15

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    expose:
      - "50051"
    environment:
      DATABASE_URL: postgres://indexer:${POSTGRES_PASSWORD:-indexer}@postgres:5432/indexer?sslmode=disable
      WORKER_COUNT: ${WORKER_COUNT:-4}
      GITHUB_TIMEOUT: ${GITHUB_TIMEOUT:-10s}
      BATCH_TIMEOUT: ${BATCH_TIMEOUT:-60s}
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-30s}
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      COLLECTOR_ADDR: collector:50051
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-70s}
    depends_on:
      - collector

volumes:
  postgres_data:
